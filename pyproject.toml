[project]
name = "enterprise-multi-agent-ai-platform"
version = "0.1.0"
description = "Enterprise Multi-Agent AI Platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "structlog>=25.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "httpx>=0.28.0",
    "ruff>=0.12.0",
    "black>=25.1.0",
    "mypy>=1.17.0",
]